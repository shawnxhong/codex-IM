# Egress allowlist proxy for the agent container (design D9, deployment.md §4.3).
# The agent has no direct route to the internet (internal network); this is its only way out.
http_port 3128

acl allowlist dstdomain "/etc/squid/allowlist"
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow allowlist
http_access deny all

cache deny all
access_log stdio:/dev/stdout
# VERIFY(ubuntu): V0 — log directives accepted by the squid version in ubuntu/squid.
cache_log /dev/stderr

# Corporate upstream proxy (optional). Uncomment and adjust:
# cache_peer proxy.example.com parent 912 0 no-query default
# never_direct allow all
